# Kodi's test Lightning node: Alby Hub on Mutinynet, a signet whose coins
# have no value. Managed by `npm run wallet`; you rarely need to touch it.
# Chain data comes from mutinynet.com, so nothing is downloaded up front.
name: kodi-testnet

services:
  lightning:
    image: ghcr.io/getalby/hub:v1.24.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080" # dashboard, reachable from this computer only
    environment:
      WORK_DIR: /data
      NETWORK: signet
      LN_BACKEND_TYPE: LDK
      LDK_ESPLORA_SERVER: https://mutinynet.com/api
      MEMPOOL_API: https://mutinynet.com/api
      LDK_GOSSIP_SOURCE: https://rgs.mutinynet.com/snapshot
      # Generated per machine by `npm run wallet` and kept in .env.local, so the
      # node unlocks itself after a restart without a password in the repo.
      AUTO_UNLOCK_PASSWORD: ${KODI_HUB_PASSWORD:-}
    volumes:
      - lightning-data:/data

volumes:
  lightning-data:
